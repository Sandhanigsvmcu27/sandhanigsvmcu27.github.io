<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রাপ্তি — ড্রাগ ব্যাংক</title>
<link rel="stylesheet" href="../css/style.css">
<meta name="theme-color" content="#d32f2f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<style>
  .rc-sticky{position:sticky;bottom:0;background:#fff;border-top:2px solid #eee;padding:12px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
  .rc-sugg{border:1px solid #ddd;border-radius:8px;background:#fff;max-height:260px;overflow:auto;margin-top:4px}
  .rc-sugg div{padding:11px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:15px}
  .rc-sugg div:hover{background:#f6f9ff}
  .rc-chip{display:inline-block;background:#e3f2fd;color:#0d47a1;border-radius:999px;padding:8px 14px;margin:0 6px 8px 0;cursor:pointer;font-size:14.5px;border:1px solid #bbdefb}
  .rc-step{display:flex;align-items:stretch;gap:6px}
  .rc-step button{width:44px;font-size:20px;padding:0}
  .rc-step input{flex:1;text-align:center}
</style>
</head>
<body>

<div class="member-shell">
  <div class="member-main">
    <h2 class="page">📦 প্রাপ্তি — নতুন ওষুধ তুলুন</h2>
    <div class="err" id="pageErr" style="display:none;"></div>
    <div class="okbox" id="rcOk" style="display:none;">✅ প্রাপ্তি সেভ হয়েছে — স্টকে যোগ হয়ে গেছে।</div>

    <div class="card">
      <form class="f" id="rcForm">
        <label for="rcDonor">দাতা / উপদেষ্টার নাম *</label>
        <input id="rcDonor" list="donorList" required placeholder="নাম লিখুন — আগের দাতারা suggestion-এ আসবে" autocomplete="off">
        <datalist id="donorList"></datalist>
        <details style="margin:10px 0;">
          <summary style="cursor:pointer;color:#1565c0;">তারিখ / নোট বদলাতে চাইলে</summary>
          <div class="row" style="margin-top:8px;">
            <div><label for="rcDate">প্রাপ্তির তারিখ</label><input type="date" id="rcDate"></div>
            <div><label for="rcNote">নোট (ঐচ্ছিক)</label><input id="rcNote" placeholder="যেমন: কার্টনসহ পেয়েছি"></div>
          </div>
        </details>

        <div id="rcQuick" style="margin-top:6px;"></div>

        <h3 style="margin:14px 0 8px;">ওষুধসমূহ</h3>
        <div id="rcLines"></div>
        <button type="button" class="btn ghost" id="rcAddLine">➕ আরেকটি ওষুধ যোগ করুন</button>
        <div class="rc-sticky">
          <span style="font-size:16.5px;"><strong id="rcCount">০</strong> টি ওষুধ · মোট <strong id="rcTotal">৳0</strong></span>
          <button type="submit" id="rcSave">সেভ করুন →</button>
        </div>
      </form>
      <p class="note">ওষুধের নাম লিখে তালিকা থেকে বাছলেই <strong>রেফারেন্স দাম (MedEx) নিজে থেকে বসে যাবে</strong>। তালিকায় না থাকলে <a href="drug-add.html">নতুন ওষুধ যোগ করুন</a>।</p>
    </div>

    <div class="card" style="margin-top:20px;">
      <h3 style="margin-bottom:10px;">সাম্প্রতিক প্রাপ্তি</h3>
      <div id="rcList"></div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
  (async function init() {
    const sess = await Auth.guard(false);
    if (!sess) return;
    document.querySelector('.member-shell').insertAdjacentHTML('afterbegin', sidebarHTML('drug-receipt.html', sess));

    const FORM_BN = { tablet: 'ট্যাবলেট', capsule: 'ক্যাপসুল', syrup: 'সিরাপ', injection: 'ইনজেকশন', cream: 'ক্রিম/জেল', drops: 'ড্রপ', other: 'অন্যান্য' };
    const BN_NUM = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    const toBn = n => String(n).replace(/\d/g, d => BN_NUM[d]);
    let meds = [], lastPrice = {}, recentMedIds = [];
    const medById = {};
    const linesEl = document.getElementById('rcLines');
    document.getElementById('rcDate').value = new Date().toISOString().slice(0, 10);

    function medLabel(m) { return m.generic_name + (m.brand_name ? ' — ' + m.brand_name : '') + (m.strength ? ' · ' + m.strength : '') + ' · ' + (FORM_BN[m.form] || m.form); }
    function priceOf(m) { return m.ref_price != null ? Number(m.ref_price) : (lastPrice[m.id] != null ? Number(lastPrice[m.id]) : null); }

    function pickMed(d, m) {
      d.dataset.mid = m.id;
      d.querySelector('.rc-search').value = medLabel(m);
      d.querySelector('.rc-sugg').style.display = 'none';
      const f = d.querySelector('.rc-fields'); f.style.display = '';
      const p = priceOf(m);
      const priceEl = d.querySelector('.rc-price');
      if (p != null) { priceEl.value = p; d.querySelector('.rc-pdisp').textContent = '৳' + p.toLocaleString('en-IN'); d.querySelector('.rc-pwrap').style.display = 'none'; }
      else { d.querySelector('.rc-pdisp').textContent = 'জানা নেই'; d.querySelector('.rc-pwrap').style.display = ''; priceEl.value = ''; }
      d.querySelector('.rc-psrc').textContent = m.ref_price != null ? '(রেফারেন্স: ' + (m.ref_source || 'MedEx') + ')' : (lastPrice[m.id] != null ? '(আগের প্রাপ্তির দাম)' : '(প্যাকেটের MRP দেখে বসান)');
      calcTotal();
      d.querySelector('.rc-qty').focus();
    }

    function addLine(prefillMed) {
      const d = document.createElement('div');
      d.className = 'rc-line';
      d.style.cssText = 'border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-bottom:10px;';
      d.dataset.mid = '';
      d.innerHTML =
        '<input class="rc-search" placeholder="Generic নাম লিখুন — যেমন Paracetamol বা Napa..." autocomplete="off">' +
        '<div class="rc-sugg" style="display:none;"></div>' +
        '<div class="rc-fields" style="display:none;">' +
        '<p style="margin:10px 0 6px;">দাম: <strong class="rc-pdisp">—</strong>/পিস <span class="rc-psrc note"></span> <button type="button" class="btn small ghost rc-ptoggle">দাম বদলান</button></p>' +
        '<div class="rc-pwrap" style="display:none;"><input type="number" class="rc-price" min="0" step="any" placeholder="প্রতি পিসের দাম (৳)"></div>' +
        '<div class="row"><div><label>পরিমাণ *</label><div class="rc-step"><button type="button" class="btn ghost rc-minus">−</button><input type="number" class="rc-qty" min="1" placeholder="কতগুলো"><button type="button" class="btn ghost rc-plus">+</button></div></div>' +
        '<div><label>মেয়াদ (মাস-বছর)</label><input type="month" class="rc-exp"></div></div>' +
        '<div style="display:flex;gap:8px;margin-top:8px;"><button type="button" class="btn small ghost rc-copy">⧉ কপি</button>' +
        '<button type="button" class="btn small ghost rc-del">✕ বাদ</button></div></div>';
      linesEl.appendChild(d);
      const search = d.querySelector('.rc-search'), sugg = d.querySelector('.rc-sugg');
      search.addEventListener('input', () => {
        d.dataset.mid = '';
        d.querySelector('.rc-fields').style.display = 'none';
        const q = search.value.trim().toLowerCase();
        if (q.length < 2) { sugg.style.display = 'none'; return; }
        let hits = meds.filter(m => searchText(m).indexOf(q) !== -1);
        hits.sort((a, b) => {
          // generic নামের মিল আগে (প্রাধান্য generic-কে), তারপর brand মিল, তারপর আগে-তোলা
          const sa = a.generic_name.toLowerCase().startsWith(q) ? 0 : ((a.brand_name || '').toLowerCase().startsWith(q) ? 1 : 2);
          const sb = b.generic_name.toLowerCase().startsWith(q) ? 0 : ((b.brand_name || '').toLowerCase().startsWith(q) ? 1 : 2);
          if (sa !== sb) return sa - sb;
          const ra = recentMedIds.indexOf(a.id) !== -1 ? 0 : 1, rb = recentMedIds.indexOf(b.id) !== -1 ? 0 : 1;
          return ra - rb;
        });
        hits = hits.slice(0, 8);
        if (!hits.length) { sugg.innerHTML = '<div style="cursor:default;color:#777;">তালিকায় নেই — <a href="drug-add.html">নতুন ওষুধ যোগ করুন</a></div>'; sugg.style.display = ''; return; }
        sugg.innerHTML = '';
        hits.forEach(m => {
          const p = priceOf(m);
          const row = document.createElement('div');
          // MedEx-style row: generic age, brand bold, tarpor strength · form, dan pase dam
          row.innerHTML = esc(m.generic_name) + (m.brand_name ? ' — <strong>' + esc(m.brand_name) + '</strong>' : '') + (m.strength ? ' · ' + esc(m.strength) : '') + ' · ' + esc(FORM_BN[m.form] || m.form) + (p != null ? ' <strong style="color:#1565c0;float:right;">৳' + p + '</strong>' : '');
          row.addEventListener('click', () => pickMed(d, m));
          sugg.appendChild(row);
        });
        sugg.style.display = '';
      });
      search.addEventListener('blur', () => setTimeout(() => { sugg.style.display = 'none'; }, 200));
      d.querySelector('.rc-ptoggle').addEventListener('click', () => {
        const w = d.querySelector('.rc-pwrap');
        w.style.display = w.style.display === 'none' ? '' : 'none';
        if (w.style.display !== 'none') d.querySelector('.rc-price').focus();
      });
      d.querySelector('.rc-price').addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        d.querySelector('.rc-pdisp').textContent = isNaN(v) ? '—' : '৳' + v.toLocaleString('en-IN');
        calcTotal();
      });
      const qty = d.querySelector('.rc-qty');
      d.querySelector('.rc-minus').addEventListener('click', () => { qty.value = Math.max(1, (parseInt(qty.value, 10) || 1) - 1); calcTotal(); });
      d.querySelector('.rc-plus').addEventListener('click', () => { qty.value = (parseInt(qty.value, 10) || 0) + 1; calcTotal(); });
      qty.addEventListener('input', calcTotal);
      d.querySelector('.rc-del').addEventListener('click', () => { d.remove(); calcTotal(); });
      d.querySelector('.rc-copy').addEventListener('click', () => { const m = medById[d.dataset.mid]; if (m) { const nd = addLine(m); } });
      if (prefillMed) pickMed(d, prefillMed);
      return d;
    }

    function calcTotal() {
      let t = 0, n = 0;
      linesEl.querySelectorAll('.rc-line').forEach(d => {
        if (!d.dataset.mid) return;
        n++;
        const q = parseInt(d.querySelector('.rc-qty').value, 10) || 0;
        const p = parseFloat(d.querySelector('.rc-price').value) || 0;
        t += q * p;
      });
      document.getElementById('rcTotal').textContent = '৳' + t.toLocaleString('en-IN');
      document.getElementById('rcCount').textContent = toBn(n);
    }
    document.getElementById('rcAddLine').addEventListener('click', () => addLine(null));

    function renderQuick() {
      const wrap = document.getElementById('rcQuick');
      const seen = [];
      recentMedIds.forEach(id => { const m = medById[id]; if (m && seen.indexOf(id) === -1) { seen.push(id); } });
      if (!seen.length) { wrap.innerHTML = ''; return; }
      wrap.innerHTML = '<p class="note" style="margin-bottom:6px;">আগে তোলা ওষুধ — চাপ দিলেই লাইন যোগ হবে:</p>';
      seen.slice(0, 8).forEach(id => {
        const m = medById[id];
        const c = document.createElement('span');
        c.className = 'rc-chip';
        c.textContent = m.generic_name + (m.strength ? ' ' + m.strength : '') + (m.brand_name ? ' (' + m.brand_name + ')' : '');
        c.addEventListener('click', () => addLine(m));
        wrap.appendChild(c);
      });
    }

    function searchText(m) {
      // Generic + brand + strength sob miliye khuje; ORS likhleo oral rehydration salt pawa jabe
      let t = (m.generic_name + ' ' + m.brand_name + ' ' + m.strength).toLowerCase();
      if (t.indexOf('rehydration') !== -1) t += ' ors';
      return t;
    }
    async function loadMeds() {
      try {
        // Catalog ekhon 1976+ row — ek call e 1000 row er limit e atke jeto, tai page kore sob load kora hoy
        meds = [];
        for (let off = 0; ; off += 1000) {
          const page = await SB.get('/medicines?select=*&order=brand_name.asc&limit=1000&offset=' + off) || [];
          meds = meds.concat(page);
          if (page.length < 1000) break;
        }
        meds.forEach(m => { medById[m.id] = m; });
        const bs = await SB.get('/drug_batches?select=medicine_id,unit_price,created_at&order=created_at.desc&limit=300') || [];
        lastPrice = {}; recentMedIds = [];
        bs.forEach(b => {
          if (lastPrice[b.medicine_id] == null) lastPrice[b.medicine_id] = b.unit_price;
          if (recentMedIds.indexOf(b.medicine_id) === -1) recentMedIds.push(b.medicine_id);
        });
        renderQuick();
      } catch (e) { meds = []; }
    }
    async function loadDonors() {
      try {
        const rows = await SB.get('/drug_receipts?select=donor_name&order=created_at.desc&limit=100') || [];
        const names = [...new Set(rows.map(r => r.donor_name).filter(Boolean))];
        document.getElementById('donorList').innerHTML = names.map(n => '<option value="' + esc(n) + '">').join('');
      } catch (e) { /* datalist ছাড়াই চলবে */ }
    }

    document.getElementById('rcForm').addEventListener('submit', async e => {
      e.preventDefault();
      const donor = document.getElementById('rcDonor').value.trim();
      if (!donor) { alert('দাতার নাম লিখুন।'); return; }
      const lines = [];
      let bad = false, badPrice = null;
      linesEl.querySelectorAll('.rc-line').forEach(d => {
        const mid = d.dataset.mid;
        if (!mid) { if (d.querySelector('.rc-search').value.trim()) bad = true; return; }
        const qty = parseInt(d.querySelector('.rc-qty').value, 10);
        const price = parseFloat(d.querySelector('.rc-price').value);
        if (isNaN(qty) || qty < 1) { bad = true; return; }
        if (isNaN(price)) { badPrice = d; return; }
        const xm = d.querySelector('.rc-exp').value;
        let exp = null;
        if (xm) { const p = xm.split('-'); exp = p[0] + '-' + p[1] + '-' + new Date(+p[0], +p[1], 0).getDate(); }
        lines.push({ mid, qty, price, exp });
      });
      if (badPrice) { badPrice.querySelector('.rc-pwrap').style.display = ''; badPrice.querySelector('.rc-price').focus(); alert('একটি ওষুধের দাম জানা নেই — দামটা বসিয়ে দিন (প্যাকেটের MRP দেখে)।'); return; }
      if (bad || !lines.length) { alert('প্রতিটি লাইনে তালিকা থেকে ওষুধ বেছে পরিমাণ দিন।'); return; }
      const btn = document.getElementById('rcSave'); btn.disabled = true;
      try {
        const total = lines.reduce((s, l) => s + l.qty * l.price, 0);
        const rc = await SB.insert('drug_receipts', {
          donor_name: donor, received_on: document.getElementById('rcDate').value || undefined,
          note: document.getElementById('rcNote').value.trim(), total_value: total, created_by: sess.name
        });
        const rid = rc && rc[0] && rc[0].id;
        if (!rid) throw new Error('receipt');
        for (const l of lines) {
          const bt = await SB.insert('drug_batches', {
            medicine_id: l.mid, batch_no: '', expiry_date: l.exp, quantity: l.qty,
            unit_price: l.price, receipt_id: rid, created_by: sess.name, updated_by: sess.name
          });
          const bid = bt && bt[0] && bt[0].id;
          if (!bid) throw new Error('batch');
          await SB.insert('drug_receipt_items', { receipt_id: rid, batch_id: bid, quantity: l.qty, unit_price: l.price });
        }
        try { await SB.insert('drug_audit', { entity: 'receipt', entity_id: rid, action: 'add', details: lines.length + ' লাইন, মোট ৳' + total, reason: '', by_name: sess.name }); } catch (e2) {}
        const ok = document.getElementById('rcOk'); ok.style.display = 'block'; ok.scrollIntoView({ behavior: 'smooth' });
        document.getElementById('rcDonor').value = ''; document.getElementById('rcNote').value = '';
        linesEl.innerHTML = ''; addLine(null); calcTotal(); loadMeds(); loadReceipts(); loadDonors();
      } catch (err) { showPageError('প্রাপ্তি সেভ করা যায়নি — আবার চেষ্টা করুন। কিছু লাইন ঢুকে গিয়ে থাকলে ড্যাশবোর্ডে দেখে নিন।'); }
      btn.disabled = false;
    });

    async function loadReceipts() {
      const wrap = document.getElementById('rcList');
      try {
        const rows = await SB.get('/drug_receipts?select=*&order=created_at.desc&limit=15') || [];
        if (!rows.length) { wrap.innerHTML = '<p class="note">এখনো কোনো প্রাপ্তি নেই।</p>'; return; }
        wrap.innerHTML = rows.map(r => '<div style="display:flex;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #eee;"><strong>' + esc(r.donor_name) + '</strong><span>' + fmtDateBn(r.received_on) + '</span><span style="margin-left:auto;"><strong>৳' + Number(r.total_value || 0).toLocaleString('en-IN') + '</strong></span><span style="color:#777;font-size:13px;">' + esc(r.created_by || '') + '</span></div>').join('');
      } catch (e) { wrap.innerHTML = '<p class="note">তালিকা আনা যায়নি।</p>'; }
    }
    await loadMeds();
    loadDonors();
    addLine(null);
    loadReceipts();
  })();
</script>
<script src="../js/pwa.js"></script>
</body>
</html>
