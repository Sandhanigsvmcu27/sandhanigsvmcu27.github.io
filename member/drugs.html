<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ড্রাগ ব্যাংক — সন্ধানী মেম্বার এরিয়া</title>
<link rel="stylesheet" href="../css/style.css">
<meta name="theme-color" content="#d32f2f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
</head>
<body>

<div class="member-shell">
  <div class="member-main">
    <h2 class="page">💊 ড্রাগ ব্যাংক ড্যাশবোর্ড</h2>
    <div class="err" id="pageErr" style="display:none;"></div>

    <div class="stat-grid" id="dgStats"></div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;">
      <a class="btn" href="drug-expired.html" style="text-decoration:none;">⏰ মেয়াদোত্তীর্ণ তালিকা</a>
      <a class="btn blue" href="drug-receipt.html" style="text-decoration:none;">📦 নতুন ওষুধ তুলুন (প্রাপ্তি)</a>
    </div>

    <div class="card">
      <h3 style="margin-bottom:8px;">🔍 ওষুধ খুঁজুন</h3>
      <input type="search" id="dgQ" placeholder="Generic বা Brand নাম লিখুন — যেমন Paracetamol বা Napa..." style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;">
      <p class="note">ফলাফল <strong>মেয়াদের ক্রমে</strong> সাজানো — যার মেয়াদ আগে শেষ হবে, সে আগে। মেয়াদ শেষ ব্যাচ লাল ও অবরুদ্ধ।</p>
      <div id="dgResults" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
  (async function init() {
    const sess = await Auth.guard(false);
    if (!sess) return;
    document.querySelector('.member-shell').insertAdjacentHTML('afterbegin', sidebarHTML('drugs.html', sess));

    const FORM_BN = { tablet: 'ট্যাবলেট', capsule: 'ক্যাপসুল', syrup: 'সিরাপ', injection: 'ইনজেকশন', cream: 'ক্রিম/মলম', drops: 'ড্রপ', other: 'অন্যান্য' };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const in60 = new Date(today); in60.setDate(in60.getDate() + 60);
    function expState(dstr) {
      if (!dstr) return { k: 'none', label: 'মেয়াদ অজানা' };
      const d = new Date(dstr + 'T00:00:00');
      if (d < today) return { k: 'expired', label: '⛔ মেয়াদ শেষ' };
      if (d <= in60) return { k: 'soon', label: '🟠 ঝুঁকি' };
      return { k: 'ok', label: '🟢 ঠিক আছে' };
    }
    function fmtTk(n) { return '৳' + Number(n || 0).toLocaleString('en-IN'); }

    let meds = [], batches = [];
    const medById = {};
    async function loadAll() {
      hidePageError();
      try {
        // Catalog 1000 row er limit par hoye geche — page kore sob medicine load kora hoy, nahole search e notun oshudh pawa jeto na
        meds = [];
        for (let off = 0; ; off += 1000) {
          const page = await SB.get('/medicines?select=*&order=generic_name.asc&limit=1000&offset=' + off) || [];
          meds = meds.concat(page);
          if (page.length < 1000) break;
        }
        batches = await SB.get('/drug_batches?select=*&quantity=gt.0&order=expiry_date.asc') || [];
      } catch (e) { showPageError(); meds = []; batches = []; }
      meds.forEach(m => { medById[m.id] = m; });
      renderStats(); renderResults();
    }
    async function renderStats() {
      let stockVal = 0, expN = 0, riskN = 0;
      batches.forEach(b => {
        stockVal += (b.quantity || 0) * Number(b.unit_price || 0);
        const st = expState(b.expiry_date).k;
        if (st === 'expired') expN++; else if (st === 'soon') riskN++;
      });
      let gotVal = 0, gaveVal = 0;
      try {
        const rc = await SB.get('/drug_receipts?select=total_value') || [];
        rc.forEach(r => { gotVal += Number(r.total_value || 0); });
        const ds = await SB.get('/distributions?select=total_value&status=eq.done') || [];
        ds.forEach(r => { gaveVal += Number(r.total_value || 0); });
      } catch (e) { /* কার্ডে — দেখাবে */ }
      const inStockMeds = new Set(batches.map(b => b.medicine_id)).size;
      document.getElementById('dgStats').innerHTML =
        '<div class="stat"><div class="n">' + fmtTk(stockVal) + '</div><div class="l">মজুত ওষুধের মোট মূল্য</div></div>' +
        '<div class="stat"><div class="n">' + fmtTk(gotVal) + '</div><div class="l">মোট প্রাপ্তি (দান)</div></div>' +
        '<div class="stat"><div class="n">' + fmtTk(gaveVal) + '</div><div class="l">মোট বিতরণ (রোগীদের)</div></div>' +
        '<div class="stat"><div class="n">' + inStockMeds + '</div><div class="l">মজুত আইটেম (ওষুধ)</div></div>' +
        '<div class="stat"><div class="n">' + expN + '</div><div class="l">⛔ মেয়াদ শেষ ব্যাচ</div></div>' +
        '<div class="stat"><div class="n">' + riskN + '</div><div class="l">🟠 ৬০ দিনে মেয়াদ যাবে</div></div>';
    }

    const qEl = document.getElementById('dgQ');
    qEl.addEventListener('input', renderResults);
    function medBatches(mid) { return batches.filter(b => b.medicine_id === mid); }
    function renderResults() {
      const q = qEl.value.trim().toLowerCase();
      const wrap = document.getElementById('dgResults');
      let list = meds.map(m => {
        const bs = medBatches(m.id);
        const tot = bs.reduce((s, b) => s + (b.quantity || 0), 0);
        const near = bs.length ? bs[0].expiry_date : null;
        return { m, bs, tot, near };
      });
      if (q) list = list.filter(x => { let t = (x.m.generic_name + ' ' + x.m.brand_name + ' ' + x.m.strength).toLowerCase(); if (t.indexOf('rehydration') !== -1) t += ' ors'; return t.indexOf(q) !== -1; });
      else list = list.filter(x => x.tot > 0);
      list.sort((a, b) => {
        if (!a.near && !b.near) return 0;
        if (!a.near) return 1; if (!b.near) return -1;
        return a.near < b.near ? -1 : 1;
      });
      if (!list.length) { wrap.innerHTML = '<p class="note">' + (q ? 'কোনো ওষুধ পাওয়া যায়নি।' : 'বর্তমানে কোনো ওষুধ মজুত নেই — প্রাপ্তি এলে এখানে দেখা যাবে। পুরো তালিকা দেখতে উপরে নাম লিখে খুঁজুন।') + '</p>'; return; }
      if (!q) wrap.innerHTML = '<p class="note" style="margin-bottom:8px;">মজুত আছে এমন ওষুধ দেখানো হচ্ছে। পুরো তালিকা থেকে খুঁজতে নাম লিখুন।</p>'; else wrap.innerHTML = '';
      list.forEach(x => {
        const m = x.m;
        const st = expState(x.near);
        const div = document.createElement('div');
        div.className = 'card'; div.style.cssText = 'margin-bottom:10px;padding:14px;';
        let rows = x.bs.map(b => {
          const bst = expState(b.expiry_date);
          return '<tr' + (bst.k === 'expired' ? ' style="background:#fdecea;"' : '') + '><td>' + esc(b.batch_no || '—') + '</td><td>' +
            (b.expiry_date ? fmtDateBn(b.expiry_date) : 'অজানা') + ' ' + bst.label + '</td><td>' + b.quantity + '</td><td>' + fmtTk(b.unit_price) + '</td><td>' + fmtTk(b.quantity * Number(b.unit_price || 0)) + '</td>' +
            '<td><button class="btn small ghost" data-edit="' + b.id + '">সংশোধন</button></td></tr>' +
            '<tr class="dg-editrow" id="dge_' + b.id + '" style="display:none;"><td colspan="6">' +
            'পরিমাণ <input type="number" min="0" id="dgq_' + b.id + '" value="' + b.quantity + '" style="width:80px;padding:6px;"> ' +
            'মেয়াদ <input type="month" id="dgx_' + b.id + '" value="' + (b.expiry_date ? b.expiry_date.slice(0, 7) : '') + '" style="padding:6px;"> ' +
            'দাম/পিস <input type="number" min="0" step="any" id="dgp_' + b.id + '" value="' + b.unit_price + '" style="width:90px;padding:6px;"> ' +
            'কারণ <input type="text" id="dgr_' + b.id + '" placeholder="কেন বদলাচ্ছেন" style="width:150px;padding:6px;"> ' +
            '<button class="btn small" data-save="' + b.id + '">সেভ</button></td></tr>';
        }).join('');
        div.innerHTML = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><strong style="font-size:17px;">' + esc(m.generic_name) + '</strong>' +
          '<span>' + (m.brand_name ? esc(m.brand_name) + ' · ' : '') + (m.strength ? esc(m.strength) + ' · ' : '') + (FORM_BN[m.form] || m.form) + '</span>' +
          (m.rx_flag ? '<span class="badge" style="background:#fff3e0;color:#e65100;">⚠️ প্রেসক্রিপশন</span>' : '') +
          '<span style="margin-left:auto;"><strong>মজুত: ' + x.tot + '</strong> · কাছের মেয়াদ: ' + (x.near ? fmtDateBn(x.near) : '—') + ' ' + st.label + '</span></div>' +
          (x.bs.length ? '<table class="t" style="margin-top:10px;"><thead><tr><th>ব্যাচ</th><th>মেয়াদ</th><th>পরিমাণ</th><th>দাম/পিস</th><th>মূল্য</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' : '<p class="note" style="margin-top:8px;">বর্তমানে মজুত নেই।</p>');
        wrap.appendChild(div);
      });
      wrap.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
        const row = document.getElementById('dge_' + btn.getAttribute('data-edit'));
        row.style.display = row.style.display === 'none' ? '' : 'none';
      }));
      wrap.querySelectorAll('[data-save]').forEach(btn => btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-save');
        const b = batches.find(x => x.id === id);
        if (!b) return;
        const nq = parseInt(document.getElementById('dgq_' + id).value, 10);
        const xm = document.getElementById('dgx_' + id).value;
        const np = parseFloat(document.getElementById('dgp_' + id).value);
        const reason = document.getElementById('dgr_' + id).value.trim();
        const patch = {};
        if (!isNaN(nq) && nq !== b.quantity) patch.quantity = nq;
        if (!isNaN(np) && np !== Number(b.unit_price)) patch.unit_price = np;
        if (xm) {
          const parts = xm.split('-'); const y = +parts[0], mo = +parts[1];
          const nd = y + '-' + String(mo).padStart(2, '0') + '-' + new Date(y, mo, 0).getDate();
          if (nd !== b.expiry_date) patch.expiry_date = nd;
        }
        if (!Object.keys(patch).length) { alert('কিছুই বদলায়নি।'); return; }
        patch.updated_by = sess.name; patch.updated_at = new Date().toISOString();
        try {
          await SB.update('/drug_batches?id=eq.' + id, patch);
          try { await SB.insert('drug_audit', { entity: 'batch', entity_id: id, action: 'edit', details: JSON.stringify(patch), reason, by_name: sess.name }); } catch (e) {}
          await loadAll();
        } catch (e) { alert('সেভ করা যায়নি, আবার চেষ্টা করুন।'); }
      }));
    }
    loadAll();
  })();
</script>
<script src="../js/pwa.js"></script>
</body>
</html>
